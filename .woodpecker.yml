when:
  - event: [push, manual, pull_request]

steps:
  - name: tree
    image: alpine:3.20
    commands:
      - test -n "$(find . -type f ! -path './.git/*' | head -1)"
  - name: no-catchall-codeowners
    image: alpine:3.20
    commands:
      - test ! -f CODEOWNERS
      - test ! -f docs/CODEOWNERS
      - test ! -f .gitea/CODEOWNERS
      - test ! -f .forgejo/CODEOWNERS
